<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="omnirush-hermes — free GPT-6 models in any OpenAI-compatible client">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#111834"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- title -->
  <text x="640" y="120" fill="#eaf2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="62" font-weight="700" text-anchor="middle">omnirush-hermes</text>
  <text x="640" y="176" fill="#8fb2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" text-anchor="middle">free GPT-6 Astra &amp; Sol in any OpenAI-compatible client</text>
  <line x1="480" y1="206" x2="800" y2="206" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>

  <!-- client -->
  <rect x="76" y="330" width="252" height="140" rx="16" fill="none" stroke="#7c9cff" stroke-width="3"/>
  <text x="202" y="384" fill="#dbe7ff" font-family="ui-monospace, Menlo, monospace" font-size="26" text-anchor="middle">Hermes Agent</text>
  <text x="202" y="418" fill="#7f93c9" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle">Cursor · Aider · SDK</text>
  <text x="202" y="510" fill="#5b6b96" font-family="ui-monospace, Menlo, monospace" font-size="19" text-anchor="middle">chat/completions</text>

  <!-- arrow 1 -->
  <line x1="340" y1="400" x2="440" y2="400" stroke="#7c9cff" stroke-width="4"/>
  <path d="M452 400 l-18 -10 v20 z" fill="#7c9cff"/>

  <!-- proxy -->
  <rect x="464" y="300" width="352" height="200" rx="20" fill="#0e1630" stroke="#5eead4" stroke-width="4"/>
  <text x="640" y="366" fill="#eafaff" font-family="ui-monospace, Menlo, monospace" font-size="36" font-weight="700" text-anchor="middle">omnirush-proxy</text>
  <text x="640" y="408" fill="#8be0cf" font-family="ui-monospace, Menlo, monospace" font-size="20" text-anchor="middle">127.0.0.1:20129</text>
  <text x="640" y="442" fill="#6c7ba6" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle">zero dependencies · Node</text>
  <text x="640" y="474" fill="#6c7ba6" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle">translates both dialects</text>

  <!-- arrow 2 -->
  <line x1="828" y1="400" x2="928" y2="400" stroke="#c084fc" stroke-width="4"/>
  <path d="M940 400 l-18 -10 v20 z" fill="#c084fc"/>

  <!-- gateway -->
  <rect x="952" y="330" width="252" height="140" rx="16" fill="none" stroke="#c084fc" stroke-width="3"/>
  <text x="1078" y="384" fill="#f0e2ff" font-family="ui-monospace, Menlo, monospace" font-size="26" text-anchor="middle">omnirush.ai</text>
  <text x="1078" y="418" fill="#9f86c9" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle">GPT-6 Astra · Sol</text>
  <text x="1078" y="510" fill="#5b6b96" font-family="ui-monospace, Menlo, monospace" font-size="19" text-anchor="middle">/v1/responses</text>

  <!-- footer -->
  <text x="640" y="592" fill="#6c7ba6" font-family="ui-monospace, Menlo, monospace" font-size="21"
        text-anchor="middle">OAuth stays local · secrets never in the repo · MIT</text>
</svg>
