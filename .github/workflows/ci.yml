name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: secrets hide in old commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: dependency-free pattern scan (tree + history)
        run: |
          chmod +x scripts/scan-secrets.sh
          scripts/scan-secrets.sh --all
          scripts/scan-secrets.sh --history

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest        # the primary target platform
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax
        run: npm run lint
      - name: unit tests (translation layer)
        run: npm run test:unit
      - name: integration tests (boots the proxy)
        run: npm run test:integration

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dry-run pack and check contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          ! grep -E 'tokens\.json|\.env($|\.)|\.log|\.plist|\.service' /tmp/pack.txt
          grep -q 'src/proxy.mjs' /tmp/pack.txt
      - name: no runtime dependencies
        run: |
          node -e "const p=require('./package.json'); if(Object.keys(p.dependencies||{}).length) { console.error('runtime dependencies are not allowed'); process.exit(1) }"
