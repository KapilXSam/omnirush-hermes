name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan covers every commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: dependency-free pattern scan
        run: |
          set -e
          chmod +x scripts/scan-secrets.sh
          scripts/scan-secrets.sh --all
          scripts/scan-secrets.sh --history
        continue-on-error: false

      - name: syntax check
        run: |
          node --check src/proxy.mjs
          for f in install.sh uninstall.sh scripts/*.sh; do bash -n "$f"; done

      - name: dependency-free smoke test of the translator
        run: node --test tests/ 2>/dev/null || node tests/smoke.mjs
